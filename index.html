<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuldanga Sarbojanin Durga Puja | Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f5f5dc;
            --gold: #d4af37;
            --deep-red: rgba(45, 10, 10, 0.75);
            --border-warm: rgba(212, 175, 55, 0.3);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0908;
            font-family: 'Inter', sans-serif;
            color: var(--cream);
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7)), 
                              url('durga-puja-background.png');
            background-size: cover;
            background-position: center;
            filter: contrast(1.1) brightness(0.9);
        }

        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .time {
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.8;
            font-weight: 300;
        }

        .status {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .status span {
            color: #4ade80;
            margin-right: 5px;
        }

        .hero {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        .hero h1 {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: -1px;
        }

        .player-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--deep-red);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-warm);
            padding: 12px 15px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .album-art {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--gold);
            transition: background-image 0.3s ease;
        }

        .song-info {
            flex-grow: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--gold);
        }

        .artist {
            font-size: 11px;
            opacity: 0.6;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--cream);
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .control-btn:hover {
            opacity: 1;
            color: var(--gold);
        }

        .progress-container {
            position: absolute;
            top: 0;
            left: 60px;
            right: 60px;
            height: 2px;
            background: rgba(255,255,255,0.2);
            transform: translateY(-12px);
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>
    <div class="film-grain"></div>

    <header>
        <div class="time" id="clock">1:32 PM</div>
        <div class="status"><span>●</span> Kuldanga Puja</div>
    </header>

    <div class="hero">
        <h1>কুলডাঙ্গা সার্বজনীন দূর্গা পূজা</h1>
    </div>

    <div class="player-container">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="album-art" id="albumArt" style="background-image: url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=100&auto=format&fit=crop');"></div>
        <div class="song-info">
            <div class="song-title" id="songTitle">Dhak Baja Kash Baja</div>
            <div class="artist" id="songArtist">Shreya Ghoshal</div>
        </div>
        <div class="controls">
            <button class="control-btn" id="prevBtn">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M4 4a.5.5 0 0 1 1 0v8a.5.5 0 0 1-1 0V4zm2.67 4L11 11.03V4.97L6.67 8z"/></svg>
            </button>
            <button class="control-btn" id="playBtn">
                <svg id="playIcon" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
            </button>
            <button class="control-btn" id="nextBtn">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M12.5 4a.5.5 0 0 0-1 0v8a.5.5 0 0 0 1 0V4zm-9 8a.5.5 0 0 0 1 0V4.97L8.83 8 4.5 11.03V4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer"></audio>

    <script>
        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Music Player Logic ---
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const titleEl = document.getElementById('songTitle');
        const artistEl = document.getElementById('songArtist');
        const coverEl = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');

        const songs = [
            {
                title: "Dhak Baja Kash Baja (Cover)",
                artist: "Shreya Ghoshal",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=100&auto=format&fit=crop"
            },
            {
                title: "Pujor Sondha",
                artist: "Traditional",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=100&auto=format&fit=crop"
            }
        ];

        let songIndex = 0;

        function loadSong(song) {
            titleEl.textContent = song.title;
            artistEl.textContent = song.artist;
            coverEl.style.backgroundImage = `url('${song.cover}')`;
            audio.src = song.src;
        }
        loadSong(songs[songIndex]);

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.innerHTML = '<path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>';
            } else {
                audio.pause();
                playIcon.innerHTML = '<path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>';
            }
        }
        playBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songs[songIndex]);
            audio.play();
            playIcon.innerHTML = '<path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>';
        });

        nextBtn.addEventListener('click', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            audio.play();
            playIcon.innerHTML = '<path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>';
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });
    </script>
</body>
</html>
